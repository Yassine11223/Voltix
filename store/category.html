<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse Voltix electronics by category, brand, price and availability.">
  <title>Shop electronics — Voltix</title>
  <link rel="stylesheet" href="../css/store.css">
  <script defer src="../js/store-data.js"></script>
  <script defer src="../js/store-ui.js"></script>
  <script defer src="../js/store-category.js"></script>
</head>
<body class="st-page">
  <a class="st-skip" href="#st-main">Skip to content</a>
  <div id="st-header"></div>
  <main id="st-main" class="st-container st-main">
    <nav class="st-breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true"> / </span><span id="st-category-breadcrumb">All products</span></nav>
    <div class="st-shop-heading"><div class="st-title-row"><h1 id="st-category-title">All products</h1><span id="st-result-count" class="st-muted" role="status" aria-live="polite"></span></div><div class="st-shop-tools"><button id="st-open-filters" class="st-button st-button-outline st-mobile-filters" type="button" aria-haspopup="dialog" aria-controls="st-filter-dialog">Filters</button><label class="st-sr-only" for="st-sort">Sort products</label><select id="st-sort" class="st-select"><option value="featured">Sort: Featured</option><option value="price-asc">Sort: Price low to high</option><option value="price-desc">Sort: Price high to low</option><option value="name-asc">Sort: Name A–Z</option><option value="newest">Sort: Newest</option></select></div></div>
    <div class="st-shop-layout">
      <aside id="st-filter-sidebar" class="st-filter-sidebar" aria-label="Product filters">
        <form id="st-filter-form" class="st-filter-form">
          <div class="st-filter-heading"><h2>Filters</h2><button class="st-text-button" type="button" data-st-clear>Clear all</button></div>
          <fieldset class="st-filter-group"><legend>Category</legend><div id="st-category-options"></div></fieldset>
          <fieldset class="st-filter-group"><legend>Brand</legend><div id="st-brand-options"></div></fieldset>
          <fieldset class="st-filter-group"><legend>Price</legend>
            <div class="st-range"><label class="st-sr-only" for="st-price-min-range">Minimum price slider</label><input id="st-price-min-range" type="range" min="0" max="2000" step="0.01" value="0"><label class="st-sr-only" for="st-price-max-range">Maximum price slider</label><input id="st-price-max-range" type="range" min="0" max="2000" step="0.01" value="2000"></div>
            <div class="st-price-inputs"><div><label for="st-price-min">Min price</label><input id="st-price-min" type="number" min="0" step="0.01" placeholder="0" inputmode="decimal"></div><span aria-hidden="true">–</span><div><label for="st-price-max">Max price</label><input id="st-price-max" type="number" min="0" step="0.01" placeholder="Any" inputmode="decimal"></div></div>
          </fieldset>
          <fieldset class="st-filter-group"><legend>Availability</legend><label class="st-check"><input id="st-instock" type="checkbox" name="instock"><span>In stock only</span></label></fieldset>
        </form>
      </aside>
      <section class="st-shop-results" aria-label="Products">
        <div id="st-filter-chips" class="st-chips st-active-chips" aria-label="Active filters"></div>
        <div id="st-category-grid" class="st-product-grid st-category-products"></div>
        <nav id="st-pagination" class="st-pagination" aria-label="Product pages"></nav>
      </section>
    </div>
    <dialog id="st-filter-dialog" class="st-filter-dialog" aria-labelledby="st-drawer-title"><div class="st-drawer-heading"><h2 id="st-drawer-title">Filters</h2><button id="st-close-filters" class="st-button st-button-outline" type="button" data-st-initial-focus aria-label="Close filters">Close</button></div><div id="st-filter-drawer-body" class="st-drawer-body"></div><div class="st-drawer-actions"><button id="st-reset-filters" class="st-button st-button-outline" type="button">Reset</button><button id="st-show-results" class="st-button st-button-primary" type="button">Show results</button></div></dialog>
  </main>
  <div id="st-footer"></div>
  <noscript><p class="st-empty">Please enable JavaScript to browse and filter the Voltix catalog.</p></noscript>
</body>
</html>
