<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover this week's Voltix electronics deals and limited-time savings.">
  <title>Exclusive deals — Voltix</title>
  <link rel="stylesheet" href="../css/store.css">
  <script defer src="../js/store-data.js"></script>
  <script defer src="../js/store-ui.js"></script>
  <script defer src="../js/store-deals.js"></script>
</head>
<body class="st-page">
  <a class="st-skip" href="#st-main">Skip to content</a>
  <div id="st-header"></div>
  <main id="st-main" class="st-container st-main">
    <section class="st-hero st-deals-hero" aria-labelledby="st-deals-heading"><div><p class="st-eyebrow">Weekly deals</p><h1 id="st-deals-heading">Exclusive deals</h1><p>Limited-time prices on selected products.</p></div><div class="st-countdown"><span>Ends in</span><strong id="st-countdown" aria-label="Time until deals refresh at the next local midnight">00h 00m 00s</strong><small>Demo timer · refreshes at midnight</small></div></section>
    <div class="st-deals-toolbar"><nav id="st-deal-categories" class="st-chips st-deal-categories" aria-label="Filter deals by category"></nav><div><label class="st-sr-only" for="st-deal-sort">Sort deals</label><select id="st-deal-sort" class="st-select"><option value="discount">Sort: Biggest discount</option><option value="price-asc">Sort: Price low to high</option><option value="price-desc">Sort: Price high to low</option><option value="name-asc">Sort: Name A–Z</option></select></div></div>
    <p id="st-deal-count" class="st-sr-only" role="status" aria-live="polite"></p>
    <div id="st-deals-grid" class="st-product-grid st-deals-products"></div>
  </main>
  <div id="st-footer"></div>
  <noscript><p class="st-empty">Please enable JavaScript to view the latest Voltix deals.</p></noscript>
</body>
</html>
