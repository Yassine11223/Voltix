<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order details | Voltix</title>
  <link rel="stylesheet" href="../css/store.css">
  <script defer src="../js/store-data.js"></script>
  <script defer src="../js/store-ui.js"></script>
  <script defer src="../js/store-order.js"></script>
</head>
<body class="st-page">
  <a class="st-skip" href="#st-main">Skip to content</a>
  <div id="st-header"></div>
  <main id="st-main" class="st-container st-main st-account-main">
    <div id="st-order" aria-live="polite"></div>
  </main>
  <dialog id="st-cancel-dialog" class="st-cancel-dialog" aria-labelledby="st-cancel-heading" aria-describedby="st-cancel-description">
    <h2 id="st-cancel-heading">Cancel this order?</h2>
    <p id="st-cancel-description" class="st-muted">Your order will be marked as cancelled. This cannot be undone.</p>
    <p id="st-cancel-error" class="st-form-error" role="alert" hidden></p>
    <div class="st-cancel-actions"><button id="st-cancel-keep" class="st-button st-button-outline" type="button" data-st-initial-focus>Keep order</button><button id="st-cancel-confirm" class="st-button st-button-danger" type="button">Cancel order</button></div>
  </dialog>
  <div id="st-footer"></div>
  <noscript><p class="st-empty">Please enable JavaScript to view your order.</p></noscript>
</body>
</html>
