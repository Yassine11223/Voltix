<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Voltix</title>
  <link rel="stylesheet" href="../css/store.css">
  <script defer src="../js/store-data.js"></script>
  <script defer src="../js/store-ui.js"></script>
  <script defer src="../js/store-auth.js"></script>
</head>
<body class="st-page">
  <a class="st-skip" href="#st-main">Skip to content</a>
  <div id="st-header"></div>
  <main id="st-main" class="st-container st-auth-main">
    <section class="st-panel st-auth-panel" aria-labelledby="st-auth-heading">
      <p class="st-eyebrow">Welcome</p>
      <h1 id="st-auth-heading">Sign in to Voltix</h1>
      <div class="st-auth-tabs" role="tablist" aria-label="Account access">
        <button id="st-signin-tab" class="st-button st-button-primary" type="button" role="tab" aria-selected="true" aria-controls="st-signin-panel">Sign in</button>
        <button id="st-register-tab" class="st-button st-button-outline" type="button" role="tab" aria-selected="false" aria-controls="st-register-panel" tabindex="-1">Create account</button>
      </div>
      <p id="st-auth-error" class="st-form-error" role="alert" hidden></p>
      <div id="st-signin-panel" role="tabpanel" aria-labelledby="st-signin-tab">
        <form id="st-signin-form" class="st-form" novalidate>
          <div class="st-field"><label for="st-login-email">Email address</label><input id="st-login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
          <div class="st-field"><label for="st-login-password">Password</label><div class="st-password-field"><input id="st-login-password" name="password" type="password" autocomplete="current-password" required><button type="button" data-st-password="st-login-password" aria-controls="st-login-password" aria-pressed="false">Show</button></div></div>
          <div class="st-auth-options"><label class="st-check" for="st-remember"><input id="st-remember" type="checkbox">Remember me</label><a href="forgot-password.html">Forgot password?</a></div>
          <button class="st-button st-button-primary st-wide" type="submit">Sign in</button>
        </form>
      </div>
      <div id="st-register-panel" role="tabpanel" aria-labelledby="st-register-tab" hidden>
        <form id="st-register-form" class="st-form" novalidate>
          <div class="st-field"><label for="st-register-name">Full name</label><input id="st-register-name" name="name" autocomplete="name" required aria-describedby="st-name-error"><span id="st-name-error" class="st-field-error"></span></div>
          <div class="st-field"><label for="st-register-email">Email address</label><input id="st-register-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="st-email-error"><span id="st-email-error" class="st-field-error"></span></div>
          <div class="st-field"><label for="st-register-phone">Phone number</label><input id="st-register-phone" name="phone" type="tel" autocomplete="tel" required aria-describedby="st-phone-error"><span id="st-phone-error" class="st-field-error"></span></div>
          <div class="st-field"><label for="st-register-password">Password</label><div class="st-password-field"><input id="st-register-password" name="password" type="password" autocomplete="new-password" required aria-describedby="st-password-help st-password-error"><button type="button" data-st-password="st-register-password" aria-controls="st-register-password" aria-pressed="false">Show</button></div><small id="st-password-help" class="st-muted">At least 8 characters, including one number.</small><span id="st-password-error" class="st-field-error"></span></div>
          <div class="st-field"><label for="st-register-confirm">Confirm password</label><div class="st-password-field"><input id="st-register-confirm" name="confirm" type="password" autocomplete="new-password" required aria-describedby="st-confirm-error"><button type="button" data-st-password="st-register-confirm" aria-controls="st-register-confirm" aria-pressed="false">Show</button></div><span id="st-confirm-error" class="st-field-error"></span></div>
          <p class="st-demo-note">Demo only: passwords are stored in this browser as plain text. Use a demo password.</p>
          <button class="st-button st-button-primary st-wide" type="submit">Create account</button>
        </form>
      </div>
      <div class="st-divider"><span>or continue with</span></div>
      <div class="st-social-buttons"><button class="st-button st-button-outline" type="button" data-st-social="google"><svg class="st-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M21 12h-9m0 0v4"></path></svg>Continue with Google</button><button class="st-button st-button-outline" type="button" data-st-social="apple"><svg class="st-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 5c0-3 3-4 4-4"></path></svg>Continue with Apple</button></div>
      <p class="st-demo-note">Demo only: social sign-in is simulated in Phase 1</p>
    </section>
  </main>
  <div id="st-footer"></div>
  <noscript><p class="st-empty">Please enable JavaScript to sign in.</p></noscript>
</body>
</html>
